<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="nixBgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="60%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020307" />
    </radialGradient>

    <!-- Outer Border Ring Gradient -->
    <linearGradient id="nixBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Ribbon Left Loop (Magenta/Pink) -->
    <linearGradient id="ribbonLeft" x1="20%" y1="90%" x2="50%" y2="10%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="30%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Ribbon Center Diagonal Loop (Violet / Indigo) -->
    <linearGradient id="ribbonDiagonal" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="25%" stop-color="#c026d3" />
      <stop offset="55%" stop-color="#7c3aed" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ribbon Right Ascent (Cyan / Neon Blue) -->
    <linearGradient id="ribbonRight" x1="10%" y1="80%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="65%" stop-color="#06b6d4" />
      <stop offset="90%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Ribbon Gloss Highlight -->
    <linearGradient id="ribbonGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Metallic NIX Font Gradient -->
    <linearGradient id="nixTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Gold Coin Outer Ring -->
    <linearGradient id="coinRimGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Gold Coin Face -->
    <radialGradient id="coinFaceGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Gold Coin Dollar Emboss -->
    <linearGradient id="dollarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <!-- Filter for subtle 3D Drop Shadow & Glow -->
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.3" />
    </filter>

    <filter id="coinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#eab308" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Base (Transparent outside, Dark inside) -->
  <g id="baseCircle">
    <!-- Outer Glow Ambient -->
    <circle cx="256" cy="256" r="246" fill="none" stroke="url(#nixBorderGrad)" stroke-width="8" opacity="0.9" />
    <circle cx="256" cy="256" r="242" fill="url(#nixBgGrad)" />
    <!-- Inner subtle glass rim -->
    <circle cx="256" cy="256" r="241" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  </g>

  <!-- The 3D Folded Ribbon "N" Symbol -->
  <g id="ribbonSymbol" filter="url(#glowDrop)">
    <!-- Back/Under Fold Shadow for 3D realism -->
    <path d="M 180 230 C 210 270, 240 310, 310 290 C 270 290, 220 270, 180 230 Z" fill="#1e1b4b" opacity="0.6" />

    <!-- Left Vertical/Curved Ribbon Segment -->
    <path d="M 124 290
             C 120 270, 126 195, 160 145
             C 185 110, 225 115, 238 150
             C 246 172, 235 200, 215 218
             C 190 240, 150 255, 124 290 Z"
          fill="url(#ribbonLeft)" />

    <!-- Glossy Highlight on Left Ribbon -->
    <path d="M 132 280
             C 130 250, 140 180, 168 140
             C 188 115, 218 120, 228 145
             C 215 130, 185 130, 160 160
             C 140 185, 134 240, 132 280 Z"
          fill="url(#ribbonGloss)" opacity="0.7" />

    <!-- Center Fold to Bottom Right (Sweeping down across) -->
    <path d="M 238 150
             C 215 190, 175 250, 185 285
             C 195 315, 240 320, 280 295
             C 320 270, 345 220, 365 175
             C 345 205, 315 250, 275 270
             C 245 285, 215 275, 210 255
             C 205 230, 225 185, 238 150 Z"
          fill="url(#ribbonDiagonal)" />

    <!-- Right Ascending Ribbon & Curl (Cyan to Light Blue) -->
    <path d="M 265 280
             C 300 270, 335 235, 355 185
             C 370 148, 365 115, 350 140
             C 335 165, 315 210, 280 250
             C 268 265, 260 275, 265 280 Z"
          fill="#0284c7" opacity="0.5" />

    <path d="M 280 295
             C 310 280, 335 240, 352 195
             C 365 160, 368 135, 355 150
             C 342 165, 330 200, 305 245
             C 285 280, 275 292, 280 295 Z"
          fill="#0369a1" opacity="0.3" />

    <!-- Main Front Right Cyan Ribbon Wave -->
    <path d="M 270 285
             C 305 270, 335 230, 355 180
             C 370 140, 372 135, 366 160
             C 358 195, 335 245, 298 285
             C 285 298, 275 295, 270 285 Z"
          fill="url(#ribbonRight)" />

    <path d="M 285 285
             C 315 265, 345 220, 362 170
             C 372 140, 365 130, 352 155
             C 340 180, 318 230, 285 285 Z"
          fill="url(#ribbonGloss)" opacity="0.6" />

    <!-- Top Right Accent Droplets -->
    <!-- Magenta Dot -->
    <circle cx="325" cy="120" r="14" fill="#f43f5e" />
    <circle cx="322" cy="116" r="5" fill="#ffffff" opacity="0.75" />

    <!-- Cyan Droplet -->
    <circle cx="368" cy="130" r="20" fill="#06b6d4" />
    <circle cx="363" cy="124" r="7" fill="#ffffff" opacity="0.8" />
    <!-- Droplet small trail/spout -->
    <path d="M 374 146 C 378 156, 385 166, 380 170 C 375 174, 370 162, 366 150 Z" fill="#38bdf8" />
  </g>

  <!-- Typography: N I X -->
  <g id="nixTypography" fill="url(#nixTextGrad)">
    <!-- Letter N -->
    <path d="M 120 405 L 120 330 L 146 330 L 176 380 L 176 330 L 198 330 L 198 405 L 172 405 L 142 355 L 142 405 Z" />

    <!-- Letter I -->
    <path d="M 218 405 L 218 330 L 242 330 L 242 405 Z" />

    <!-- Letter X -->
    <path d="M 262 405 L 285 368 L 264 330 L 290 330 L 302 352 L 314 330 L 340 330 L 318 368 L 342 405 L 316 405 L 302 381 L 288 405 Z" />
  </g>

  <!-- 3D Gold Coin with $ Sign -->
  <g id="goldCoin" filter="url(#coinGlow)">
    <!-- Shadow beneath coin -->
    <circle cx="390" cy="368" r="46" fill="#000000" opacity="0.5" />

    <!-- Outer Gold Rim -->
    <circle cx="388" cy="365" r="44" fill="url(#coinRimGrad)" stroke="#fef08a" stroke-width="1.5" />

    <!-- Inner Stepped Border -->
    <circle cx="388" cy="365" r="39" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.8" />

    <!-- Coin Face -->
    <circle cx="388" cy="365" r="37" fill="url(#coinFaceGrad)" />

    <!-- Embossed Dollar Sign ($) -->
    <!-- Vertical Bars -->
    <line x1="388" y1="344" x2="388" y2="386" stroke="url(#dollarGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- S Curve -->
    <path d="M 397 353
             C 397 348, 380 347, 380 355
             C 380 363, 396 364, 396 373
             C 396 382, 378 382, 378 376"
          fill="none" stroke="url(#dollarGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Highlight Reflection on Coin Edge -->
    <path d="M 360 348 C 370 335, 395 330, 412 342" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

    <!-- 4-Point Specular Flare on Coin Edge -->
    <g transform="translate(418, 335)">
      <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="3" fill="#fef08a" />
    </g>
  </g>
</svg>
